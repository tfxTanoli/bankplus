<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 52" fill="none" width="100%" height="100%">
  <defs>
    <!-- Emblem Background Gradient: Deep Banking Navy to Corporate Royal Blue -->
    <linearGradient id="emblemGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#002b7f" />
      <stop offset="50%" stopColor="#003d99" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>

    <!-- Emblem Inner Border Highlight -->
    <linearGradient id="emblemBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#7dd3fc" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#0284c7" stopOpacity="0.2" />
    </linearGradient>

    <!-- Top Specular Gloss Arc -->
    <linearGradient id="emblemGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
    </linearGradient>

    <!-- Plus Cross Symbol Gradient -->
    <linearGradient id="plusGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="60%" stopColor="#f0f9ff" />
      <stop offset="100%" stopColor="#bae6fd" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#002b7f" floodOpacity="0.25" />
    </filter>
  </defs>

  <style>
    .bp-text-bank {
      font-family: 'Montserrat', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 24.5px;
      letter-spacing: -0.5px;
      fill: #002b7f;
    }
    .bp-text-plus {
      font-family: 'Montserrat', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 24.5px;
      letter-spacing: -0.5px;
      fill: #0284c7;
    }
    .bp-text-tm {
      font-family: 'Montserrat', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 8.5px;
      fill: #64748b;
    }
    .bp-text-tagline {
      font-family: 'Montserrat', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 7.2px;
      letter-spacing: 0.14em;
      fill: #003399;
    }
  </style>

  <!-- 1. LEFT EMBLEM: Banking Crest with 3D Crystalline "+" Cross -->
  <g filter="url(#badgeShadow)">
    <!-- Base Rounded Square -->
    <rect x="4" y="6" width="40" height="40" rx="10" fill="url(#emblemGrad)" />
    <!-- Inner Border -->
    <rect x="4.5" y="6.5" width="39" height="39" rx="9.5" stroke="url(#emblemBorder)" stroke-width="1" />
    <!-- Top Sheen Highlight -->
    <path d="M 6 16 C 6 10, 10 7, 16 7 L 32 7 C 38 7, 42 10, 42 16 C 42 18, 36 21, 24 21 C 12 21, 6 18, 6 16 Z" fill="url(#emblemGloss)" />

    <!-- Plus Cross Symbol: Vertical & Horizontal Pill Arms -->
    <!-- Vertical Bar -->
    <rect x="20" y="14" width="8" height="24" rx="3.5" fill="url(#plusGrad)" />
    <!-- Horizontal Bar -->
    <rect x="12" y="22" width="24" height="8" rx="3.5" fill="url(#plusGrad)" />
    <!-- Center Spark Gem Node -->
    <polygon points="24,22 27.5,26 24,30 20.5,26" fill="#ffffff" opacity="0.95" />
    <circle cx="24" cy="26" r="1.5" fill="#0284c7" />
  </g>

  <!-- 2. WORDMARK: "BANK" + "PLUS" + "™" -->
  <text x="54" y="30" class="bp-text-bank">BANK</text>
  <text x="128" y="30" class="bp-text-plus">PLUS</text>
  <text x="198" y="19" class="bp-text-tm">™</text>

  <!-- 3. TAGLINE: "FINANCIAL EDUCATION SIMPLIFIED." -->
  <text x="55" y="43" class="bp-text-tagline">FINANCIAL EDUCATION SIMPLIFIED.</text>
</svg>
